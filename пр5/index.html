<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Угадай число</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=McLaren&family=Rubik+Bubbles&family=Rubik+Mono+One&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <h1>Угадай число от 1 до 100!</h1>
        <input type="number" id="userInput" min="1" max="100" placeholder="Введи число" disabled />
        <p id="help">Подсказка - </p>
        <p id="attempt">Попыток - </p>
        <button onclick="checkGuess()">Проверить</button>
        <button onclick="startGame()">Начать новую игру</button>
    </div>
    
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
